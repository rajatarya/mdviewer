name: Release
run-name: mdviewer release, tag ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and upload release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94
          targets: x86_64-apple-darwin, aarch64-apple-darwin
          components: clippy, rustfmt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri app
        run: cd src-tauri && tauri build

      - name: Find DMG assets
        id: dmg
        run: |
          # The DMG is at workspace root target/ (not src-tauri/target/)
          DMG_PATH=$(find target/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -1)
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "Found: $DMG_PATH"
          [ -n "$DMG_PATH" ] || { echo "No .dmg found"; exit 1; }

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Markdown Viewer v${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: ${{ steps.dmg.outputs.DMG_PATH }}
